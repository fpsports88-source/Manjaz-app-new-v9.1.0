  <title>منجز Ultra</title>
  <style>
    *{box-sizing:border-box}
    :root{
      --bg:#f5f7fb; --surface:#fff; --surface2:#eef2f7; --surface3:#e5eaf2;
      --text:#0f172a; --muted:#64748b; --border:#dbe2ea;
      --accent:#2563eb; --ok:#059669; --warn:#d97706; --danger:#dc2626;
      --gold:#f59e0b; --silver:#94a3b8; --bronze:#b45309; --diamond:#22d3ee; --royal:#7c3aed;
      --radius:16px; --shadow:0 10px 28px rgba(15,23,42,.08);
      --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
      --accent-soft:rgba(37,99,235,.12); --accent-soft:color-mix(in srgb, var(--accent) 12%, transparent);
    }
    [data-theme="dark"]{
      --bg:#0b1220; --surface:#111827; --surface2:#172033; --surface3:#1f2937;
      --text:#e5e7eb; --muted:#9aa4b2; --border:#334155;
      --shadow:0 14px 36px rgba(0,0,0,.35);
    }
    html,body{height:100%;max-width:100%;overflow-x:hidden}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,"Noto Sans Arabic",sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
    button,input,select,textarea{font:inherit;color:inherit}
    button{cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);min-height:44px;border-radius:12px;padding:10px 14px;font-weight:800;transition:.15s}
    button:hover{background:var(--surface2)}
    button:disabled{opacity:.55;cursor:not-allowed}
    input,select,textarea{width:100%;min-height:44px;font-size:16px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);padding:10px 12px}
    textarea{min-height:90px;resize:vertical}
    :focus-visible{outline:3px solid rgba(37,99,235,.35);outline-offset:2px;border-radius:10px}
    .hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:.86rem}.center{text-align:center}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
    .grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.cols-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
    .title{margin:0 0 4px;font-size:1.05rem;font-weight:900}.subtitle{margin:0;color:var(--muted);font-size:.9rem}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
    .btn.sm{min-height:36px;padding:7px 10px;font-size:.86rem;border-radius:10px}
    .icon-btn{width:44px;height:44px;min-height:44px;padding:0;display:grid;place-items:center;border-radius:12px}
    .chip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;border:1px solid var(--border);background:var(--surface2);font-size:.86rem;font-weight:800;min-height:38px}
    .chip.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,var(--border));color:var(--accent)}
    .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:99px;font-size:.76rem;font-weight:900;background:var(--surface2);border:1px solid var(--border)}
    .badge.high{color:var(--danger)}.badge.medium{color:var(--warn)}.badge.low{color:var(--ok)}
    .badge.new{color:var(--muted)}.badge.inProgress{color:var(--accent)}.badge.done{color:var(--ok)}
    .dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--muted)}
    .progress{height:9px;background:var(--surface3);border-radius:99px;overflow:hidden;margin-top:8px}.progress>span{display:block;height:100%;background:var(--accent)}
    .kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border)}.kv:last-child{border-bottom:0}
    .list{display:flex;flex-direction:column}.list-item{display:flex;gap:12px;align-items:flex-start;padding:14px;border-bottom:1px solid var(--border)}.list-item:last-child{border-bottom:0}.list-item.done{opacity:.62}
    .list-main{flex:1;min-width:0}.list-title{font-weight:900;margin:0 0 4px;word-break:break-word}.meta{display:flex;flex-wrap:wrap;gap:8px;color:var(--muted);font-size:.82rem}
    .empty{padding:30px 16px;text-align:center;color:var(--muted)}.empty .emoji{font-size:2rem;display:block;margin-bottom:8px}
    .field{display:flex;flex-direction:column;gap:6px}.field span{font-size:.88rem;color:var(--muted);font-weight:800}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid .full{grid-column:1/-1}
    .checkbox-line{display:flex;align-items:center;gap:8px;min-height:44px}.checkbox-line input{width:auto;min-height:auto}
    .app-root{min-height:100dvh}
    .auth-wrap{min-height:100dvh;display:grid;place-items:center;padding:16px;background:radial-gradient(circle at 18% 12%,var(--accent-soft),transparent 28%),radial-gradient(circle at 82% 78%,rgba(124,58,237,.14),transparent 26%),var(--bg)}
    .auth-card{width:min(100%,580px);background:var(--surface);border:1px solid var(--border);border-radius:26px;box-shadow:var(--shadow);padding:18px;display:grid;gap:14px}
    .auth-hero{text-align:center;display:grid;gap:8px}.auth-hero .logo{width:76px;height:76px;border-radius:24px;margin:auto;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--royal));color:#fff;box-shadow:var(--shadow);cursor:pointer}
    .auth-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:var(--surface2);border:1px solid var(--border);padding:6px;border-radius:16px}
    .tab-btn{min-height:42px;border:0;background:transparent;color:var(--muted);border-radius:12px;font-weight:900}.tab-btn.active{background:var(--surface);color:var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.06)}
    .panel{display:none}.panel.active{display:block;animation:fadeUp .18s ease}@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .auth-form{display:grid;gap:10px}.link-btn{background:transparent;border:0;color:var(--accent);font-weight:900;min-height:auto;padding:4px}
    .profile-list{display:grid;gap:8px}.profile-row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:14px;background:var(--surface2)}
    .profile-row .avatar{width:34px;height:34px}.profile-row .meta{flex:1;min-width:0}.profile-row strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .google-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f2937;border-color:#dadce0}[data-theme="dark"] .google-btn{background:#111827;color:#e5e7eb;border-color:#334155}
    .shell{display:grid;grid-template-columns:260px 1fr;min-height:100dvh}
    .sidebar{position:fixed;inset-block:0;width:260px;background:var(--surface);border-inline-end:1px solid var(--border);display:flex;flex-direction:column;z-index:60;padding-top:var(--safe-t)}
    [dir="rtl"] .sidebar{right:0;transform:translateX(100%)}[dir="ltr"] .sidebar{left:0;transform:translateX(-100%)}.sidebar.open{transform:none}
    .brand{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--border)}.brand-logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--royal));color:#fff;display:grid;place-items:center}
    .nav{padding:10px;overflow:auto;flex:1}.nav-item{width:100%;display:flex;align-items:center;gap:10px;padding:11px 12px;margin:3px 0;border:0;background:transparent;color:var(--muted);border-radius:12px;text-align:start}
    .nav-item:hover{background:var(--surface2);color:var(--text)}.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:900}
    .sidebar-footer{padding:14px;border-top:1px solid var(--border);color:var(--muted);font-size:.8rem}
    .main{min-width:0;display:flex;flex-direction:column;min-height:100dvh}[dir="rtl"] .main{margin-right:260px}[dir="ltr"] .main{margin-left:260px}
    .topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + var(--safe-t))}
    .top-title{flex:1;min-width:0}.top-title h1{margin:0;font-size:1.08rem}.top-title p{margin:0;font-size:.8rem}
    .view{padding:16px;max-width:1400px;width:100%;margin:auto}
    .bottom-nav{display:none;position:fixed;inset-inline:0;bottom:0;height:68px;background:var(--surface);border-top:1px solid var(--border);z-index:55;padding-bottom:var(--safe-b)}
    .bottom-nav .nav-item{flex:1;justify-content:center;text-align:center;flex-direction:column;gap:2px;font-size:.72rem;margin:0;border-radius:0}

      let watchUnsub=null, watchUid=null;

        log(action,details={}){ if(!state.developer.unlocked)return; state.developer.logs.unshift({id:uid(),at:iso(),action,details}); state.developer.logs=state.developer.logs.slice(0,200); saveState(false); },
        async sendAnnouncement(title,body,pinned=false){ if(!state.developer.unlocked||!fb.ready)throw new Error('Developer access/Firebase required'); await fb.db.collection('announcements').add({title:String(title).trim().slice(0,160),body:String(body).trim().slice(0,3000),createdAt:iso(),author:'YS',active:true,pinned:!!pinned}); this.log('announcement',{title,pinned:!!pinned}); toast(t('savedMsg'),'success'); },
        async setAnnouncement(id,patch){ if(!state.developer.unlocked||!fb.ready)throw new Error('Developer access/Firebase required'); await fb.db.collection('announcements').doc(id).update(patch); this.log('announcement-update',{id,...patch}); },
        async grantXp(targetUid,amount){ if(!state.developer.unlocked||!fb.ready)throw new Error('Developer access/Firebase required'); const n=Math.round(num(amount,0)); if(!targetUid||n<1||n>1000000)throw new Error('Invalid UID or XP amount'); const ref=fb.db.collection('users').doc(targetUid).collection('data').doc('main'); let newXp=0,newLevel=1; await fb.db.runTransaction(async tx=>{ const snap=await tx.get(ref); if(!snap.exists)throw new Error('User data not found'); const data=snap.data()||{}, st=data.state||{}; st.game=st.game||{}; newXp=Math.max(0,Math.round(num(st.game.xp,0))+n); newLevel=levelFromXp(newXp); st.game.xp=newXp; st.game.level=newLevel; tx.set(ref,{state:st,updatedAt:Date.now()},{merge:true}); }); await fb.db.collection('publicProfiles').doc(targetUid).set({xp:newXp,level:newLevel,updatedAt:iso()},{merge:true}); this.log('grant-xp',{targetUid,amount:n,newXp,newLevel}); toast(t('savedMsg'),'success'); },
        async setLevel(targetUid,level){ if(!state.developer.unlocked||!fb.ready)throw new Error('Developer access/Firebase required'); const l=clamp(Math.round(num(level,1)),1,1000); const xp=xpForLevel(l); const ref=fb.db.collection('users').doc(targetUid).collection('data').doc('main'); await fb.db.runTransaction(async tx=>{ const snap=await tx.get(ref); if(!snap.exists)throw new Error('User data not found'); const data=snap.data()||{}, st=data.state||{}; st.game=st.game||{}; st.game.xp=xp; st.game.level=l; tx.set(ref,{state:st,updatedAt:Date.now()},{merge:true}); }); await fb.db.collection('publicProfiles').doc(targetUid).set({xp,level:l,updatedAt:iso()},{merge:true}); this.log('set-level',{targetUid,level:l,xp}); toast(t('savedMsg'),'success'); },
        async createGlobalChallenge(d){ if(!state.developer.unlocked||!fb.ready)throw new Error('Developer access/Firebase required'); const c=normalizeChallenge({...d,ownerId:fb.auth.currentUser.uid,source:'cloud',status:'active'}); const payload={...c,createdAt:iso(),createdBy:fb.auth.currentUser.uid,global:true}; delete payload.id; const ref=await fb.db.collection('challenges').add(payload); c.id=ref.id; state.challenges.cloud.unshift(c); this.log('global-challenge',{id:c.id,title:c.title}); toast(t('challengeCreated'),'success'); return c; },

      /* =========================

      const FRAME_DEFS=[

      ];
      const TITLE_DEFS=[
        {id:'student',ar:'طالب',en:'Student',level:1},{id:'focused',ar:'مركّز',en:'Focused',level:3},{id:'productive',ar:'منتج',en:'Productive',level:5},{id:'scholar',ar:'عالِم',en:'Scholar',level:8},{id:'master',ar:'محترف',en:'Master',level:12},{id:'legend',ar:'أسطورة',en:'Legend',level:18},{id:'champion',ar:'بطل الفرق',en:'Team Champion',badge:'team_champion'},{id:'founder',ar:'مؤسس',en:'Founder',badge:'ys_founder'}
      ];
      const BADGE_DEFS=[
        {id:'first_task',ar:'أول إنجاز',en:'First task',icon:'check',xp:20,check:()=>state.tasks.some(t=>t.status==='done')},
        {id:'first_focus',ar:'أول تركيز',en:'First focus',icon:'focus',xp:20,check:()=>completedSessions().length>=1},
        {id:'ten_tasks',ar:'10 مهام',en:'10 tasks',icon:'tasks',xp:50,check:()=>state.tasks.filter(t=>t.status==='done').length>=10},
        {id:'fifty_tasks',ar:'50 مهمة',en:'50 tasks',icon:'trophy',xp:150,check:()=>state.tasks.filter(t=>t.status==='done').length>=50},
        {id:'five_sessions',ar:'5 جلسات',en:'5 sessions',icon:'focus',xp:50,check:()=>completedSessions().length>=5},
        {id:'focus_600',ar:'10 ساعات',en:'10 hours',icon:'fire',xp:200,check:()=>completedSessions().reduce((s,x)=>s+x.actualSec/60,0)>=600},
        {id:'streak_3',ar:'3 أيام',en:'3 days',icon:'fire',xp:60,check:()=>state.game.streak>=3},
        {id:'streak_7',ar:'أسبوع',en:'Week',icon:'trophy',xp:140,check:()=>state.game.streak>=7},
        {id:'streak_30',ar:'شهر',en:'Month',icon:'crown',xp:400,check:()=>state.game.streak>=30},
        {id:'group_creator',ar:'قائد مجموعة',en:'Group leader',icon:'users',xp:40,check:()=>state.groups.length>=1},
        {id:'team_creator',ar:'مؤسس فريق',en:'Team founder',icon:'crown',xp:80,check:()=>state.teams.some(t=>t.ownerId===state.auth.uid)},
        {id:'team_champion',ar:'بطل الفريق',en:'Team champion',icon:'trophy',xp:250,check:()=>state.game.challengeWins>=5 && state.teams.length>=1},
        {id:'race_winner',ar:'فائز سباق',en:'Race winner',icon:'zap',xp:100,check:()=>state.game.raceWins>=1},
        {id:'ys_founder',ar:'مؤسس YS',en:'YS Founder',icon:'crown',xp:500,check:()=>state.developer.unlocked}
      ];
      function frameName(id){ const f=FRAME_DEFS.find(x=>x.id===id); return f?(state.settings.lang==='ar'?f.ar:f.en):id; }
      function titleName(id){ const f=TITLE_DEFS.find(x=>x.id===id); return f?(state.settings.lang==='ar'?f.ar:f.en):id; }
      function badgeName(id){ const b=BADGE_DEFS.find(x=>x.id===id); return b?(state.settings.lang==='ar'?b.ar:b.en):id; }
      let badgeLock=false;
      const Gamification={
        addXp(amount,skip=false){ const before=levelFromXp(state.game.xp); state.game.xp=Math.max(0,Math.round(state.game.xp+Math.max(0,amount))); state.game.level=levelFromXp(state.game.xp); if(state.game.level>before){ toast(`${t('levelUp')}: ${state.game.level}`,'success'); this.unlockFramesByLevel(); this.unlockTitlesByLevel(); } if(!skip) this.checkBadges(); saveState(); publishProfileToCloud(); },
        markStudyDay(){ const k=dateKey(new Date()); if(!state.game.studyDates.includes(k)) state.game.studyDates.push(k); this.updateStreak(); },
        updateStreak(){ const dates=new Set(state.game.studyDates); let cur=dateKey(new Date()); if(!dates.has(cur)) cur=dateKey(addDays(new Date(),-1)); let c=0; while(dates.has(cur)){ c++; cur=dateKey(addDays(parseDate(cur+'T00:00')||new Date(),-1)); } state.game.streak=c; state.game.bestStreak=Math.max(state.game.bestStreak||0,c); },
        completeTaskReward(task){ let xp=20+(task.priority==='high'?15:task.priority==='medium'?8:0)+task.subtasks.filter(s=>s.done).length*3; this.recordFirstCompletion(); this.markStudyDay(); this.addXp(xp); celebrate(); },
        focusReward(sec){ this.markStudyDay(); this.addXp(Math.max(1,Math.round(sec/60))); },
        recordFirstCompletion(){ const today=dateKey(new Date()); if(state.game.firstCompletionDate!==today){ state.game.firstCompletionDate=today; state.game.firstCompletionAt=iso(); } },
        unlockFrame(id){ if(!FRAME_DEFS.some(f=>f.id===id)) return; if(!state.game.frames.unlocked.includes(id)){ state.game.frames.unlocked.push(id); toast(`${t('frameUnlocked')}: ${frameName(id)}`,'success'); saveState(false); } },
        unlockTitle(id){ if(!TITLE_DEFS.some(f=>f.id===id)) return; if(!state.game.titles.unlocked.includes(id)){ state.game.titles.unlocked.push(id); toast(`${t('titleUnlocked')}: ${titleName(id)}`,'success'); saveState(false); } },
        unlockFramesByLevel(){ FRAME_DEFS.forEach(f=>{ if(f.level && state.game.level>=f.level) this.unlockFrame(f.id); }); },
        unlockTitlesByLevel(){ TITLE_DEFS.forEach(f=>{ if(f.level && state.game.level>=f.level) this.unlockTitle(f.id); }); },
        unlockFrameByBadge(b){ FRAME_DEFS.forEach(f=>{ if(f.badge===b) this.unlockFrame(f.id); }); },
        unlockTitleByBadge(b){ TITLE_DEFS.forEach(f=>{ if(f.badge===b) this.unlockTitle(f.id); }); },
        equipFrame(id){ if(!state.game.frames.unlocked.includes(id)){ toast(t('locked'),'warn'); return; } state.game.frames.equipped=id; saveState(); render(); toast(t('equipped'),'success'); },
        equipTitle(id){ if(!state.game.titles.unlocked.includes(id)){ toast(t('locked'),'warn'); return; } state.game.titles.equipped=id; saveState(); render(); toast(t('equipped'),'success'); },
        checkBadges(){ if(badgeLock) return; badgeLock=true; BADGE_DEFS.forEach(b=>{ try{ if(!state.game.badges[b.id] && b.check()){ state.game.badges[b.id]={at:iso()}; toast(`${t('badgeUnlocked')}: ${badgeName(b.id)}`,'success'); this.unlockFrameByBadge(b.id); this.unlockTitleByBadge(b.id); this.addXp(b.xp||20,true); } }catch{} }); badgeLock=false; saveState(false); }
      };

      /* =========================
         8) Services
         ========================= */
      let undoFn=null;
      const Tasks={
        create(data){ const task=normalizeTask(data); state.tasks.unshift(task); saveState(); Gamification.checkBadges(); return task; },
        update(id,patch){ const x=taskById(id); if(!x)return; Object.assign(x,patch); Object.assign(x,normalizeTask(x)); saveState(); },
        remove(id){ const i=state.tasks.findIndex(x=>x.id===id); if(i<0)return; const item=state.tasks[i]; state.tasks.splice(i,1); saveState(); undoFn=()=>{state.tasks.splice(i,0,item);saveState();render();}; toast(t('deleted'),'info',{label:t('undo'),action:'undo'}); },
        complete(id){ const x=taskById(id); if(!x||x.status==='done')return; x.status='done'; x.completedAt=iso(); x.subtasks.forEach(s=>s.done=true); x.progress=100; Gamification.completeTaskReward(x); if(x.repeat!=='none' && x.dueAt){ const days=x.repeat==='daily'?1:x.repeat==='weekly'?7:x.repeatInterval; state.tasks.unshift(normalizeTask({...x,id:uid(),status:'new',completedAt:null,dueAt:new Date(parseDate(x.dueAt).getTime()+days*DAY).toISOString(),subtasks:x.subtasks.map(s=>({id:uid(),title:s.title,done:false})),progress:0,actualMin:0})); toast(t('nextOccurrence'),'info'); } saveState(); Gamification.checkBadges(); render(); toast(t('taskCompleted'),'success'); },
        toggle(id){ const x=taskById(id); if(!x)return; if(x.status==='done') Tasks.update(id,{status:'new',completedAt:null}); else Tasks.complete(id); }
      };
      const Subjects={ upsert(d){ const s=normalizeSubject(d); const i=state.subjects.findIndex(x=>x.id===s.id); if(i>=0)state.subjects[i]=s; else state.subjects.push(s); saveState(); return s; }, remove(id){ state.tasks.forEach(t=>{if(t.subjectId===id)t.subjectId=null;}); state.subjects=state.subjects.filter(x=>x.id!==id); saveState(); toast(t('deleted'),'success'); } };
      const Groups={ upsert(d){ const g=normalizeGroup(d); const i=state.groups.findIndex(x=>x.id===g.id); if(i>=0)state.groups[i]=g; else state.groups.unshift(g); saveState(); Gamification.checkBadges(); return g; }, remove(id){ state.groups=state.groups.filter(x=>x.id!==id); state.tasks.forEach(t=>{if(t.groupId===id)t.groupId=null;}); saveState(); toast(t('deleted'),'success'); } };
      const Teams={
        async create(d){ if(state.teams.some(x=>x.shared&&(x.memberIds||[]).includes(state.auth.uid))){ toast((state.settings.lang==='ar'?'أنت في فريق بالفعل — غادره أو احذفه أولًا لإنشاء فريق جديد':'You are already in a team — leave or delete it first'),'warn'); return null; } const g=normalizeTeam(d); if(fb.ready && state.auth.provider==='firebase' && state.auth.uid){ g.ownerId=state.auth.uid; g.memberIds=[state.auth.uid]; g.shared=true; const ref=await fb.db.collection('teams').add({...g,createdAt:firebase.firestore.FieldValue.serverTimestamp()}); g.id=ref.id; await fb.db.collection('teamCodes').doc(g.joinCode).set({teamId:ref.id,ownerId:state.auth.uid}).catch(()=>{}); } else { g.ownerId='local'; g.memberIds=['local']; } state.teams.unshift(g); state.activeTeamId=g.id; saveState(); Gamification.checkBadges(); publishProfileToCloud(); toast(t('teamCreated'),'success'); return g; },
        async joinByCode(code){ if(state.teams.some(x=>x.shared&&(x.memberIds||[]).includes(state.auth.uid))){ toast((state.settings.lang==='ar'?'أنت في فريق بالفعل — غادره أولًا للانضمام لفريق آخر':'You are already in a team — leave it first'),'warn'); return false; } const c=String(code||'').trim().toUpperCase(); if(!c){toast(t('invalidTeamCode'),'error');return false;} if(!fb.ready || state.auth.provider!=='firebase'){toast(t('requiresFirebase'),'warn');return false;} try{ const codeSnap=await fb.db.collection('teamCodes').doc(c).get(); if(!codeSnap.exists){toast(t('invalidTeamCode'),'error');return false;} const tid=codeSnap.data().teamId; if(state.teams.some(x=>x.id===tid)){toast(t('alreadyInTeam'),'warn');return false;} const ref=fb.db.collection('teams').doc(tid); await ref.update({memberIds:firebase.firestore.FieldValue.arrayUnion(state.auth.uid),updatedAt:iso()}); const doc=await ref.get(); const data=doc.data()||{}; const team=normalizeTeam({id:doc.id,...data}); const i=state.teams.findIndex(x=>x.id===team.id); if(i>=0)state.teams[i]=team; else state.teams.unshift(team); state.activeTeamId=team.id; saveState(); Gamification.checkBadges(); toast(t('teamJoined'),'success'); return true; }catch{ toast(t('invalidTeamCode'),'error'); return false; } },
        async leave(id){ const team=teamById(id); if(!team)return; if(team.shared && fb.ready && state.auth.uid){ if(!team.memberIds.includes(state.auth.uid)){toast(t('notInTeam'),'warn');return;} await fb.db.collection('teams').doc(id).update({memberIds:firebase.firestore.FieldValue.arrayRemove(state.auth.uid),updatedAt:iso()}); } state.teams=state.teams.filter(x=>x.id!==id); if(state.activeTeamId===id)state.activeTeamId=state.teams[0]?.id||null; saveState(); toast(t('teamLeft'),'success'); },
        async purgeCloud(id,joinCode){
          const db=fb.db; const msgs=await db.collection('teams').doc(id).collection('messages').limit(400).get().catch(()=>null);
          if(msgs) await Promise.all(msgs.docs.map(d=>d.ref.delete().catch(()=>{})));
          for(const p of ['all','daily','weekly','week','day','month']){
            db.collection('teamBoard').doc(p).collection('teams').doc(id).delete().catch(()=>{});
            const st=await db.collection('teamMembers').doc(id).collection(p).limit(200).get().catch(()=>null);
            if(st) await Promise.all(st.docs.map(d=>d.ref.delete().catch(()=>{})));
          }
          if(joinCode) await db.collection('teamCodes').doc(joinCode).delete().catch(()=>{});
          await db.collection('teams').doc(id).delete();
        },
        async purge(id){
          const team=teamById(id); if(!team) return;
          if(team.shared && fb.ready && state.auth.uid){
            if(!(team.ownerId===state.auth.uid||state.developer.unlocked)){ toast((state.settings.lang==='ar'?'لا يمكنك حذف فريق لا تملكه':'You can only delete your own team'),'warn'); return; }
            try{ await this.purgeCloud(id,team.joinCode); }catch(e){ toast(t('requiresFirebase')+' ['+((e&&e.code)||'')+']','error'); return; }
          }
          state.teams=state.teams.filter(x=>x.id!==id); if(state.activeTeamId===id) state.activeTeamId=state.teams[0]?.id||null; saveState(); toast(t('deleted'),'success');
        },
        async delete(id){ const team=teamById(id); if(!team)return; if(team.shared && fb.ready && state.auth.uid===team.ownerId) await fb.db.collection('teamCodes').doc(team.joinCode).delete().catch(()=>{}); await fb.db.collection('teams').doc(id).delete().catch(()=>{}); state.teams=state.teams.filter(x=>x.id!==id); if(state.activeTeamId===id)state.activeTeamId=state.teams[0]?.id||null; saveState(); toast(t('deleted'),'success'); },
        setActive(id){ state.activeTeamId=id; saveState(); render(); },
        async fetch(){ if(!fb.ready || state.auth.provider!=='firebase' || !state.auth.uid)return; try{ const snap=await fb.db.collection('teams').where('memberIds','array-contains',state.auth.uid).limit(50).get(); const cloud=snap.docs.map(d=>normalizeTeam({id:d.id,...d.data()})); state.teams=state.teams.filter(x=>!x.shared||cloud.some(c=>c.id===x.id)); cloud.filter(x=>x.ownerId===state.auth.uid).forEach(x=>fb.db.collection('teamCodes').doc(x.joinCode).set({teamId:x.id,ownerId:state.auth.uid}).catch(()=>{})); state.teams=[...cloud,...state.teams.filter(t=>!t.shared)]; if(state.activeTeamId && !state.teams.some(t=>t.id===state.activeTeamId)) state.activeTeamId=state.teams[0]?.id||null; saveState(false); }catch(e){ console.warn(e); } }
      };
      const Challenges={

      }

      function filteredTasks(){
        const q=state.ui.taskSearch.trim().toLowerCase(), now=new Date(), f=state.ui.taskFilter;
        let list=state.tasks.filter(x=>{
          if(q && !`${x.title} ${x.description} ${x.notes} ${x.tags.join(' ')}`.toLowerCase().includes(q)) return false;
          if(state.ui.groupFilter!=='all' && x.groupId!==state.ui.groupFilter) return false;
          if(state.ui.teamFilter!=='all' && x.teamId!==state.ui.teamFilter) return false;
          if(f==='today') return x.status!=='done'&&x.dueAt&&sameDay(parseDate(x.dueAt),now);
          if(f==='upcoming') return x.status!=='done'&&x.dueAt&&parseDate(x.dueAt)>=now;
          if(f==='overdue') return isOverdue(x);
          if(f==='done') return x.status==='done';
          return true;
        });
        const pw={high:3,medium:2,low:1};
        list.sort((a,b)=>{
          if(state.ui.taskSort==='due') return (parseDate(a.dueAt)?.getTime()||Infinity)-(parseDate(b.dueAt)?.getTime()||Infinity);
          if(state.ui.taskSort==='priority') return pw[b.priority]-pw[a.priority];
          if(state.ui.taskSort==='created') return new Date(b.createdAt)-new Date(a.createdAt);
          return a.title.localeCompare(b.title);
        });
        return list;
      }
      function renderTasksContent(){
        const list=filteredTasks();
        if(state.ui.taskView==='kanban') return `<div class="kanban">${STATUS.map(st=>`<div class="kanban-col" data-status="${st}"><div class="row between"><strong>${esc(t(st))}</strong><span class="badge">${list.filter(x=>x.status===st).length}</span></div>${list.filter(x=>x.status===st).map(x=>`<div class="kanban-card" draggable="true" data-id="${x.id}"><div class="list-title">${esc(x.title)}</div><div class="meta"><span class="badge ${x.priority}">${esc(t(x.priority))}</span></div></div>`).join('')||emptyHtml(t('noTasks'))}</div>`).join('')}</div>`;
        return `<div class="list">${list.length?list.map(taskRow).join(''):emptyHtml(t('noTasks'))}</div>`;
      }
      function renderTasks(){
        return `<div class="card"><div class="toolbar"><input id="taskSearch" class="input" placeholder="${esc(t('search'))}" value="${esc(state.ui.taskSearch)}"><select id="taskSort" class="input" style="max-width:160px"><option value="due" ${state.ui.taskSort==='due'?'selected':''}>${esc(t('sortDue'))}</option><option value="priority" ${state.ui.taskSort==='priority'?'selected':''}>${esc(t('sortPriority'))}</option><option value="created" ${state.ui.taskSort==='created'?'selected':''}>${esc(t('sortCreated'))}</option><option value="title" ${state.ui.taskSort==='title'?'selected':''}>${esc(t('sortTitle'))}</option></select><select class="input" style="max-width:160px" data-action="group-filter"><option value="all">${esc(t('all'))} ${esc(t('groups'))}</option>${state.groups.map(g=>`<option value="${g.id}" ${state.ui.groupFilter===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select><select class="input" style="max-width:160px" data-action="team-filter"><option value="all">${esc(t('all'))} ${esc(t('teams'))}</option>${state.teams.map(g=>`<option value="${g.id}" ${state.ui.teamFilter===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select><button class="btn" data-action="toggle-view">${esc(state.ui.taskView==='list'?t('kanban'):t('list'))}</button><button class="btn primary" data-action="new-task">${icon('plus',18)} ${esc(t('addTask'))}</button></div><div class="row" style="margin-bottom:10px">${['today','upcoming','overdue','done','all'].map(f=>`<button class="chip ${state.ui.taskFilter===f?'active':''}" data-action="task-filter" data-filter="${f}">${esc(t(f))}</button>`).join('')}</div><div id="tasksContent">${renderTasksContent()}</div></div>`;

      function lbRow(r,i=0){ return `<div class="list-item" data-pid="${esc(r.id)}" ${Social.rowStyle(r)}><div class="lb-rank ${i===0?'top1':i===1?'top2':i===2?'top3':''}" style="min-width:28px">${i+1}</div>${r.photo?`<img class="avatar frame-${esc(r.frame||'none')}" src="${esc(r.photo)}" style="width:34px;height:34px" alt="">`:`<span class="avatar frame-${esc(r.frame||'none')}" style="width:34px;height:34px;background:${esc(r.avatarColor||'var(--accent)')}">${esc((r.displayName||'م').slice(0,1).toUpperCase())}</span>`}<div class="list-main"><div class="list-title">${esc(r.displayName||'—')} ${Social.badgeFor(r)}${roleChip(r.id)}</div><div class="meta"><span>${esc(r.title||t('student'))}</span><span>${esc(t('level'))} ${esc(r.level||1)}</span><span>${esc(r.xp||0)} XP</span><span>${esc(r.streak||0)} ${esc(t('streak'))}</span></div></div></div>`; }

      /* ===== Developer Control Center ===== */
      const DevCenter={ rows:null, q:'', err:'', busy:false,
        L(a,e){ return state.settings.lang==='ar'?a:e; },
        async load(){ if(this.busy||!fb.ready) return; this.busy=true; try{ const sn=await fb.db.collection('publicProfiles').orderBy('xp','desc').limit(300).get(); this.rows=sn.docs.map(d=>({id:d.id,...d.data()})); this.err=''; }catch(e){ this.rows=[]; this.err=(e&&e.code)||'error'; } this.busy=false; this.paint(); },
        paint(){ const el=document.getElementById('devCenter'); if(el) el.innerHTML=this.inner(); },
        html(){ if(this.rows===null) setTimeout(()=>this.load(),0); return `<div id="devCenter">${this.inner()}</div>`; },
        listHtml(){ const q=this.q.trim().toLowerCase().replace(/^mz-/,''); const R=(this.rows||[]).filter(r=>!q||(String(r.displayName||'')+' '+(r.handle||'')+' '+pid(r.id)+' '+r.id).toLowerCase().includes(q)).slice(0,40);
          return R.map(r=>`<div class="list-item" data-pid="${esc(r.id)}"><span class="avatar" style="width:36px;height:36px;background:${esc(r.avatarColor||'var(--accent)')}">${esc((r.displayName||'م').slice(0,1).toUpperCase())}</span><div class="list-main"><div class="list-title">${esc(r.displayName||'—')} ${Social.badgeFor(r)}</div><div class="meta"><span dir="ltr">${esc(pid(r.id))}</span><span>L${esc(r.level||1)}</span><span>${esc(r.xp||0)} XP</span></div></div></div>`).join('')||emptyHtml(t('noData')); },
        inner(){ const R=this.rows, L=(a,e)=>this.L(a,e);
          if(R===null) return `<div class="card dc-wrap"><div class="muted">${L('جارٍ تحميل لوحة التحكم…','Loading control center…')}</div></div>`;
          const now=Date.now(), day=864e5, age=r=>now-(Date.parse(r.updatedAt||'')||0), sum=k=>R.reduce((n,r)=>n+(+r[k]||0),0);
          const K=[['👥',R.length>=300?'300+':R.length,L('مستخدم','Users')],['🟢',R.filter(r=>age(r)<day).length,L('نشط 24س','Active 24h')],['📅',R.filter(r=>age(r)<7*day).length,L('نشط 7 أيام','Active 7d')],['⚡',sum('xp').toLocaleString(),'XP'],['✅',sum('tasksCompleted').toLocaleString(),L('مهام منجزة','Tasks done')],['🔥',Math.max(0,...R.map(r=>+r.bestStreak||0)),L('أفضل سلسلة','Best streak')]];
          const tiers={}; R.forEach(r=>{ const x=Social.tierOf(r.xp,r.level), k=x?x.icon+' '+x.name:'—'; tiers[k]=(tiers[k]||0)+1; }); const mx=Math.max(1,...Object.values(tiers));
          return `<div class="card dc-wrap"><div class="row between"><h3 class="title">🎛️ ${L('مركز التحكم','Control center')}</h3><button type="button" class="btn sm" data-dc="reload">↻</button></div>${this.err?`<div class="muted small" style="color:var(--danger)">${esc(this.err)}</div>`:''}
          <div class="dc-kpis">${K.map(([i,v,l])=>`<div class="dc-kpi"><span>${i}</span><b>${esc(v)}</b><small>${esc(l)}</small></div>`).join('')}</div>
          <div class="dc-tiers">${Object.entries(tiers).map(([k,v])=>`<div class="dc-trow"><span>${esc(k)}</span><div class="progress"><span style="width:${Math.round(v/mx*100)}%"></span></div><b>${v}</b></div>`).join('')}</div>
          <input class="input" id="dcSearch" placeholder="${esc(L('ابحث بالاسم أو الـ ID…','Search name or ID…'))}" value="${esc(this.q)}" style="margin-top:12px"><div class="list" id="dcList" style="margin-top:10px">${this.listHtml()}</div></div>`; },
        actions(id,r){ return `<div class="dc-actions"><div class="muted small" dir="ltr" style="user-select:all;word-break:break-all">UID: ${esc(id)}</div><div class="row" style="flex-wrap:wrap;gap:8px;margin-top:8px">${[100,500,1000,5000].map(n=>`<button type="button" class="btn sm" data-dc="xp" data-id="${esc(id)}" data-n="${n}">+${n} XP</button>`).join('')}<button type="button" class="btn sm" data-dc="mod" data-id="${esc(id)}" data-name="${esc(r.displayName||'User')}">🛡️ ${this.L('مشرف','Mod')}</button></div></div>`; }
      };
      document.addEventListener('input',e=>{ if(e.target&&e.target.id==='dcSearch'){ DevCenter.q=e.target.value; const l=document.getElementById('dcList'); if(l) l.innerHTML=DevCenter.listHtml(); } });
      document.addEventListener('click',async e=>{ const b=e.target.closest('[data-dc]'); if(!b||!state.developer.unlocked) return; const a=b.dataset.dc, id=b.dataset.id;
        try{
          if(a==='reload'){ DevCenter.rows=null; DevCenter.busy=false; DevCenter.paint(); DevCenter.load(); }
          else if(a==='xp'){ await Developer.grantXp(id,+b.dataset.n); toast(t('savedMsg'),'success'); DevCenter.load(); }
          else if(a==='mod'){ const at=iso(), name=b.dataset.name||'User'; await Promise.all([fb.db.collection('moderators').doc(id).set({name,at}),fb.db.collection('staff').doc(id).set({role:'moderator',name,at})]); await Social.loadConfig(); toast(t('savedMsg'),'success'); }
        }catch(err){ toast((err&&err.message)||(err&&err.code)||'error','error'); }
      });

      function parseQuickAdd(text){
        let title=text.trim(); const res={title,tags:[],priority:'medium',dueAt:null,estimate:25,subjectId:null,groupId:null,teamId:state.activeTeamId||null};
        title=title.replace(/#(\S+)/g,(m,w)=>{res.tags.push(w);return '';});
        if(/!(high|عالية|عاجل)/i.test(title)){res.priority='high'; title=title.replace(/!(high|عالية|عاجل)/gi,'');}
        state.subjects.forEach(s=>{ if(title.includes(s.name)){res.subjectId=s.id; title=title.replace(s.name,' ');}});
        const now=new Date(); let d=new Date(); let hasDate=false;
        if(/بكرة|غدًا|غدا|tomorrow/i.test(title)){d=addDays(now,1);hasDate=true;title=title.replace(/بكرة|غدًا|غدا|tomorrow/gi,'');}
        const tm=title.match(/([01]?\d|2[0-3])[:\s\.]?([0-5]\d)?\s*(ص|م|am|pm)?/i);
        if(tm){let h=Number(tm[1]); const m=Number(tm[2]||0); const mer=(tm[3]||'').toLowerCase(); if(['م','pm'].includes(mer)&&h<12)h+=12; if(['ص','am'].includes(mer)&&h===12)h=0; d.setHours(h,m,0,0); if(!hasDate&&d<now)d=addDays(d,1); res.dueAt=d.toISOString(); title=title.replace(tm[0],'');}
        else if(hasDate){d.setHours(20,0,0,0);res.dueAt=d.toISOString();}
        const est=title.match(/(\d+)\s*(د|دقيقة|min)/i); if(est){res.estimate=Number(est[1]); title=title.replace(est[0],'');}
        res.title=title.replace(/\s+/g,' ').trim()||text.trim(); return res;
      }
